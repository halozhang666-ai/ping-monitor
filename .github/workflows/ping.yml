name: ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping target
        continue-on-error: true
        env:
          PING_TARGET: ${{ secrets.PING_TARGET }}
        run: |
          echo "ping -> ${PING_TARGET}"
          if curl -fsS -m 20 "$PING_TARGET" -o /dev/null; then
            echo "reachable"
          else
            echo "no response"
          fi
