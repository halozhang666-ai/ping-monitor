name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: https://afdf8336d5232da7f.app.workbuddy.host/api/keepalive?sharecode=MAGCBAUEJT
    steps:
      - name: 云端心跳 + 自愈触发
        run: |
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "目标: $KEEPALIVE_URL"
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -m 25 "$KEEPALIVE_URL" || echo 000)
            echo "  第${i}次 HTTP=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          echo "--- 面板自愈返回 ---"
          cat /tmp/resp.json 2>/dev/null || echo "(无响应)"
          echo ""
          if [ "$ok" = "1" ]; then
            echo "RESULT=OK" >> "$GITHUB_ENV"
          else
            echo "RESULT=DOWN" >> "$GITHUB_ENV"
          fi
          echo "结束时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - name: 计时日志
        run: |
          echo "## 云端心跳计时" >> "$GITHUB_STEP_SUMMARY"
          echo "- 北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "- 结果: ${RESULT:-UNKNOWN} / 运行 #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标: keepalive 自愈接口 (scooter-dsc.tun.ply.gg:25565)" >> "$GITHUB_STEP_SUMMARY"
